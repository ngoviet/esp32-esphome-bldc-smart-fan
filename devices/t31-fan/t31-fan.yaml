# ========== T31 FAN CONFIG ==========
# Chỉ ghi phần khác mặc định trong common/base.yaml
substitutions:
  device_name: "t31-fan"

  # GPIO (board mới không hỏng chân nào)
  clk_channel: "8"
  oscillation_pin: "GPIO27"

  # Chế độ duty 30-99.5%
  clk_inverted: "true"
  speed_duty_mode_val: "true"

  # Speed display
  speed_param_name: "Fan Duty"
  speed_param_unit: "%"

  # Auto-off oscillation when fan stops
  on_fan_off_action: "id(oscillation_switch).turn_off();"

packages:
  base-oscillation: !include ../../common/base-oscillation.yaml
