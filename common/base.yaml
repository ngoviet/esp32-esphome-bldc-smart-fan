# ===========================================
# T-Series Fan — Shared Device Logic (ESPHome)
# ===========================================
# This file is shared across t1-fan, t2-fan, t31-fan, mt1-fan, modem-fan via ESPHome packages.
# Defaults live in `substitutions:` below; per-device YAML files override only what differs.
# ===========================================

substitutions:
  # Giá trị mặc định = quạt chế độ tần số (T1/MT1). File thiết bị chỉ ghi phần KHÁC
  # mặc định — substitution trong file chính đè lên substitution của package.

  # Board PlatformIO (PC8 dùng nodemcu-32s)
  board: "esp32dev"

  # GPIO
  clk_pin: "GPIO26"
  clk_channel: "0"
  encoder_clk_pin: "GPIO32"
  encoder_dt_pin: "GPIO33"
  encoder_sw_pin: "GPIO25"

  # Xung CLK: false = chế độ tần số 100-320Hz duty 50%, true = chế độ duty
  clk_inverted: "false"
  speed_duty_mode_val: "false"
  default_frequency: "150"
  freq_min: "100"
  freq_max: "320"  # 400Hz quá nhanh — hạ trần 2026-10-20

  encoder_resolution: "1"
  logger_baud_rate: "115200"
  firmware_version: "2.2.0"

  # Cảm biến hiển thị tốc độ
  speed_param_name: "Fan Frequency"
  speed_param_unit: "Hz"

  # Duty mode mapping: false = duty 30-99.5% (T31), true = PWM đảo (modem-fan Nidec)
  duty_inverted_speed_val: "false"
  # Sàn duty tối thiểu (chỉ áp dụng nhánh duty-inverted). 0.0 = không sàn.
  duty_min_scale_val: "0.0"
  # Hệ số giới hạn max duty (chỉ áp dụng nhánh duty-inverted). 1.0 = không giới hạn.
  duty_max_scale_val: "1.0"
  # Action khi fan tắt (T31 dùng để tắt oscillation; modem-fan để trống)
  on_fan_off_action: ""

esphome:
  name: ${device_name}
  on_boot:
    priority: 200
    then:
      - lambda: |-
          if (!id(speed_duty_mode) && id(fan_light).current_values.is_on()) {
            id(apply_freq).execute();
          }

esp32:
  board: ${board}
  framework:
    type: arduino

# ---------- WIFI CONFIG ----------
# ssid/password/fast_connect nằm trong wifi.yaml (dùng chung với motor-test)
packages:
  wifi: !include wifi.yaml

wifi:
  reboot_timeout: 30min

# ---------- LOGGING & API ----------
logger:
  baud_rate: ${logger_baud_rate}
  level: DEBUG

api:
  reboot_timeout: 15min

ota:
  - platform: esphome

# ========== BIẾN LƯU TẦN SỐ NỀN ==========
globals:
  - id: freq_hz
    type: int
    restore_value: yes
    initial_value: '${default_frequency}'
  - id: disable_sync_until
    type: uint32_t
    initial_value: '0'
  - id: speed_duty_mode
    type: bool
    restore_value: no
    initial_value: '${speed_duty_mode_val}'
  - id: syncing_from_ha
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ledc_running
    type: bool
    restore_value: no
    initial_value: 'false'

# ---------- XUẤT XUNG CLK THỰC TẾ ----------
output:
  - platform: ledc
    id: clk_out
    pin: ${clk_pin}
    channel: ${clk_channel}
    frequency: ${default_frequency}Hz
    inverted: ${clk_inverted}

# ---------- TEMPLATE OUTPUT (CHUYỂN % -> HZ) ----------
# Output ảo này nhận mức thay đổi độ sáng 0.0 -> 1.0 (0-100%) từ Light
  - platform: template
    id: brightness_to_freq_output
    type: float
    write_action:
      - lambda: |-
          // Khóa ghi đè trong vòng 2 giây kể từ lần cuối vặn núm (chống nhảy ngược)
          uint32_t elapsed = millis() - id(disable_sync_until);
          if (elapsed >= 2000) {
            int expected_knob = (int)((state * 100.0f) / 3.0f + 0.5f);
            if (id(knob).state != expected_knob) {
              id(disable_sync_until) = millis();
              id(syncing_from_ha) = true;
              id(knob).set_value(expected_knob);
              id(syncing_from_ha) = false;
            }
          }

          // state nhận giá trị từ 0.0 đến 1.0
          if (id(speed_duty_mode)) {
            // Chế độ duty-cycle
            if (state <= 0.01) {
              id(freq_hz) = 0;
              id(clk_out).set_level(0.0f);
              id(ledc_running) = false;
              ${on_fan_off_action}
            } else if (${duty_inverted_speed_val}) {
              // PWM active-low (Nidec): inverted pin -> set_level(x) = pin (1-x).
              // brightness -> level TRỰC TIẾP: 100% -> set_level(1) -> pin LOW = quay max.
              // Tắt (set_level 0) -> pin HIGH = dừng. KHÔNG đảo trong lambda (đảo 2 lần = ngược).
              // duty_min_scale_val: sàn duty tối thiểu (VD 0.26 = 26%) — duty thấp quá quạt ko quay nổi.
              // duty_max_scale_val: trần duty tối đa (VD 0.90 = 90%).
              // Mapping: state ~0.01 -> duty_min, state 1.0 -> duty_max.
              float duty = (float)${duty_min_scale_val} + state * ((float)${duty_max_scale_val} - (float)${duty_min_scale_val});
              id(freq_hz) = (int)(duty * 100.0f);
              if (!id(ledc_running)) {
                id(apply_freq).execute();
                id(ledc_running) = true;
              } else {
                id(clk_out).set_level(duty);
              }
            } else {
              // T31: brightness 1-100% → duty 30-99.5%
              float duty = 0.30f + (state * 0.70f);
              if (duty > 0.995f) duty = 0.995f;
              id(freq_hz) = (int)(duty * 100.0f);
              if (!id(ledc_running)) {
                id(apply_freq).execute();
                id(ledc_running) = true;
              } else {
                id(clk_out).set_level(duty);
              }
            }
          } else {
            // Chế độ tần số: freq_min-freq_max (100-320Hz), duty 50%
            if (state <= 0.01) {
              id(freq_hz) = 0;
              id(clk_out).set_level(0.0f);
            } else {
              id(freq_hz) = (int)(state * (float)(${freq_max} - ${freq_min})) + ${freq_min};
              id(apply_freq).execute();
            }
          }

# ---------- SCRIPT ÁP TẦN SỐ / DUTY ----------
script:
  - id: apply_freq
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(speed_duty_mode);'
          then:
            - output.ledc.set_frequency:
                id: clk_out
                frequency: !lambda 'return ${default_frequency};'
            - output.set_level:
                id: clk_out
                level: !lambda 'return id(freq_hz) / 100.0f;'
          else:
            - output.ledc.set_frequency:
                id: clk_out
                frequency: !lambda 'return id(freq_hz);'
            - output.set_level:
                id: clk_out
                level: 50%

# ---------- ENTITY ĐÈN / QUẠT TRONG HA ----------
light:
  - platform: monochromatic
    name: "Speed"
    id: fan_light
    icon: "mdi:fan"
    output: brightness_to_freq_output
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF

# ---------- NÚM XOAY ECC11 ----------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder ECC11"
    pin_a:
      number: ${encoder_clk_pin}
      mode:
        input: true
        pullup: true
    pin_b:
      number: ${encoder_dt_pin}
      mode:
        input: true
        pullup: true
    resolution: ${encoder_resolution}

    # Sử dụng bộ đếm số nguyên phần cứng của Encoder để dập lỗi nhảy số!
    # Từ 0 đến 33 khấc (Mỗi khấc 3%. 0=0%, 33=99~100%)
    min_value: 0
    max_value: 33
    on_value:
      - lambda: |-
          if (id(syncing_from_ha)) return;

          id(disable_sync_until) = millis();

          float b = (x * 3.0f) / 100.0f;
          if (b >= 0.99f) b = 1.0f; // Khóa 100% tại max

          if (b <= 0.01f) {
            if (!id(fan_light).current_values.is_on()) { return; }
            id(fan_light).turn_off().perform();
          } else {
            auto call = id(fan_light).turn_on();
            call.set_brightness(b);
            call.perform();
          }
    internal: true

  # Fan speed parameter (duty % for T31, Hz for T1-T3)
  - platform: template
    name: "${speed_param_name}"
    lambda: "return id(freq_hz);"
    update_interval: 5s
    unit_of_measurement: "${speed_param_unit}"
    entity_category: diagnostic
    icon: "mdi:sine-wave"

  # WiFi diagnostic
  - platform: wifi_signal
    id: rssi_dbm
    name: "WiFi RSSI"
    update_interval: 30s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

# ---------- TEXT SENSOR ----------
text_sensor:
  - platform: template
    name: "Firmware Version"
    lambda: "return {std::string(\"${firmware_version}\")};"
    update_interval: 3600s
    entity_category: diagnostic
    icon: "mdi:information-outline"

  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
    ssid:
      name: "WiFi SSID"

# ---------- NÚT NHẤN TRÊN ENCODER (BẬT/TẮT QUẠT) ----------
binary_sensor:
  - platform: gpio
    pin:
      number: ${encoder_sw_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Nút ấn ECC11"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - light.toggle: fan_light

# Nút mềm khởi động lại
button:
  - platform: restart
    id: restart_button
    name: "Restart thiết bị"
