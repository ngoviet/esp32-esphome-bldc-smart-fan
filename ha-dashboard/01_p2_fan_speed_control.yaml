# ============================================================
# P2 Fan Speed Control — Điều khiển tốc độ quạt theo công suất
# ============================================================
# Map 10-500W → brightness_pct 1-97. Dưới 20W thì tắt quạt.
#
# Sửa tham số: vào HA Settings > Devices > Helpers, tìm "P2 Fan ..."
# HOẶC sửa trực tiếp giá trị mặc định (initial) ở input_number bên dưới.
#
# Tham số:
#   off_threshold : dưới mức này → tắt quạt
#   min_power     : cận dưới dải map
#   max_power     : cận trên dải map
#   min_speed     : brightness_pct tại min_power
#   max_speed     : brightness_pct tại max_power (và khi vượt max_power)
# ============================================================

input_boolean:
  p2_fan_auto_speed:
    name: "P2 Fan — Auto Speed"
    initial: true
    icon: mdi:speedometer

input_number:
  p2_fan_off_threshold:
    name: "P2 Fan — Ngưỡng tắt (W)"
    min: 0
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: "W"
    initial: 20

  p2_fan_min_power:
    name: "P2 Fan — Min Power (W)"
    min: 0
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: "W"
    initial: 10

  p2_fan_max_power:
    name: "P2 Fan — Max Power (W)"
    min: 0
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: "W"
    initial: 500

  p2_fan_min_speed:
    name: "P2 Fan — Min Speed (%)"
    min: 1
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    initial: 1

  p2_fan_max_speed:
    name: "P2 Fan — Max Speed (%)"
    min: 1
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    initial: 97

automation:
  - id: "p2_fan_speed_control"
    alias: "P2 Fan Speed Control"
    triggers:
      - trigger: state
        entity_id: sensor.p2_power
      - trigger: state
        entity_id: input_boolean.p2_fan_auto_speed
        to: "on"
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: state
        entity_id: input_boolean.p2_fan_auto_speed
        state: "on"
    actions:
      - variables:
          min_p: "{{ states('input_number.p2_fan_min_power') | float(0) }}"
          max_p: "{{ states('input_number.p2_fan_max_power') | float(0) }}"
          min_s: "{{ states('input_number.p2_fan_min_speed') | float(0) }}"
          max_s: "{{ states('input_number.p2_fan_max_speed') | float(0) }}"
          off_t: "{{ states('input_number.p2_fan_off_threshold') | float(0) }}"
          p: "{{ states('sensor.p2_power') | float(0) }}"
          speed: >
            {%- if p >= max_p -%}
              {{ max_s | int }}
            {%- elif p <= min_p -%}
              {{ min_s | int }}
            {%- else -%}
              {{ ((p - min_p) / (max_p - min_p) * (max_s - min_s) + min_s) | round(0, 'common') | int }}
            {%- endif -%}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ p | float(0) >= off_t }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.fan_master_2_speed
                data:
                  brightness_pct: "{{ speed }}"
        default:
          - action: light.turn_off
            target:
              entity_id: light.fan_master_2_speed
            data: {}
    mode: restart
